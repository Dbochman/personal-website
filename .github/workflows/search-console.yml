name: Search Console Data Export

on:
  workflow_dispatch:
  # Schedule moved to analytics-daily.yml for unified daily collection

env:
  NODE_OPTIONS: --use-openssl-ca
  NODE_USE_SYSTEM_CA: "0"
  NODE_EXTRA_CA_CERTS: ""

jobs:
  fetch-search-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write

    steps:
      # BEGIN GENERATED TLS BOOTSTRAP — .github/security/sync-workflows.mjs
      -
        id: tls
        name: Bootstrap CI trust (offline)
        timeout-minutes: 2
        shell: bash
        run: |
          python3 - <<'PY'
          """Offline, pre-checkout trust bootstrap for GitHub-hosted Ubuntu jobs.

          Inlined into workflows by sync-workflows.mjs; never downloaded at job runtime.
          Temporary root exclusions match Homebrew ca-certificates 2026-10-20:
          https://github.com/Homebrew/homebrew-core/blob/HEAD/Formula/c/ca-certificates.rb
          """

          import hashlib
          import os
          from pathlib import Path
          import re
          import ssl
          import subprocess
          import tempfile


          BLOCKED_KEYS = frozenset({
              "bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3",
              "c619e4780ed8e0abeda24ad732567de4383a7ea941338f6d1a7d1b49ac792fe9",
              "8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782",
          })


          def public_key_hash(pem):
              key = subprocess.run(
                  ["openssl", "x509", "-pubkey", "-noout"], input=pem,
                  capture_output=True, check=True, timeout=5,
              ).stdout
              der = subprocess.run(
                  ["openssl", "pkey", "-pubin", "-outform", "DER"], input=key,
                  capture_output=True, check=True, timeout=5,
              ).stdout
              return hashlib.sha256(der).hexdigest()


          def filter_bundle(source, blocked=BLOCKED_KEYS):
              certs = re.findall(
                  rb"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", source, re.S,
              )
              if not certs or len(certs) != source.count(b"-----BEGIN CERTIFICATE-----"):
                  raise ValueError("empty or truncated CA bundle")
              kept = [cert for cert in certs if public_key_hash(cert) not in blocked]
              if not kept:
                  raise ValueError("no trusted certificates remain")
              result = b"\n".join(kept) + b"\n"
              ssl.create_default_context(cadata=result.decode("ascii"))
              return result, len(certs) - len(kept)


          def main():
              # No network, sudo, checkout, third-party imports, or credentials required.
              bundle, removed = filter_bundle(Path("/etc/ssl/certs/ca-certificates.crt").read_bytes())
              directory = Path(tempfile.mkdtemp(prefix="ci-tls-", dir=os.environ["RUNNER_TEMP"]))
              # Public roots must remain readable by subsequent privilege-dropped steps.
              directory.chmod(0o755)
              ca_file = directory / "ca.pem"
              ca_file.write_bytes(bundle)
              ca_file.chmod(0o644)
              empty = directory / "empty"
              empty.mkdir()
              # A clean CA file alone is insufficient: OpenSSL can also load its hash dir.
              settings = {key: str(ca_file) for key in (
                  "SSL_CERT_FILE", "CURL_CA_BUNDLE", "GIT_SSL_CAINFO",
                  "REQUESTS_CA_BUNDLE", "PIP_CERT", "GRPC_DEFAULT_SSL_ROOTS_FILE_PATH",
              )}
              settings.update(SSL_CERT_DIR=str(empty), GIT_SSL_CAPATH=str(empty))
              # NODE_OPTIONS must be declared in YAML; GITHUB_ENV explicitly forbids it.
              with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
                  for key, value in settings.items():
                      if "\n" in value or "\r" in value:
                          raise ValueError("invalid environment path")
                      output.write(f"{key}={value}\n")
              print(f"CI trust bundle ready; excluded {removed} root certificate(s)")


          if __name__ == "__main__":
              main()
          PY
      # END GENERATED TLS BOOTSTRAP
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch Search Console data
        env:
          SEARCH_CONSOLE_CREDENTIALS: ${{ secrets.SEARCH_CONSOLE_CREDENTIALS }}
        run: node scripts/fetch-search-console-data.js

      - name: Commit updated metrics
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/metrics/search-console-history.json docs/metrics/latest.json
          git diff --staged --quiet || git commit -m "chore: update Search Console metrics [skip ci]"
          git push

      - name: Upload search data
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: search-console-data
          path: docs/metrics/search-console-history.json
          retention-days: 30
          if-no-files-found: error

      - name: Check for significant ranking drops
        run: |
          node -e "
          const fs = require('fs');
          const historyFile = 'docs/metrics/search-console-history.json';

          if (!fs.existsSync(historyFile)) {
            console.log('⚠️  No history file found, skipping ranking check');
            process.exit(0);
          }

          const history = JSON.parse(fs.readFileSync(historyFile, 'utf8'));

          if (history.length < 2) {
            console.log('⚠️  Not enough historical data for comparison');
            process.exit(0);
          }

          const latest = history[history.length - 1];
          const previous = history[history.length - 2];

          console.log('📊 Search Console Metrics:');
          console.log(\`   Clicks: \${latest.summary.totalClicks} (prev: \${previous.summary.totalClicks})\`);
          console.log(\`   Impressions: \${latest.summary.totalImpressions} (prev: \${previous.summary.totalImpressions})\`);
          console.log(\`   Avg Position: \${latest.summary.averagePosition} (prev: \${previous.summary.averagePosition})\`);
          console.log(\`   Avg CTR: \${latest.summary.averageCTR}% (prev: \${previous.summary.averageCTR}%)\`);

          const failures = [];

          // Check for significant drops (>20% decrease)
          const clicksChange = ((latest.summary.totalClicks - previous.summary.totalClicks) / previous.summary.totalClicks) * 100;
          const impressionsChange = ((latest.summary.totalImpressions - previous.summary.totalImpressions) / previous.summary.totalImpressions) * 100;
          const positionChange = latest.summary.averagePosition - previous.summary.averagePosition;

          if (clicksChange < -20) {
            failures.push(\`Clicks dropped by \${Math.abs(Math.round(clicksChange))}%\`);
          }
          if (impressionsChange < -20) {
            failures.push(\`Impressions dropped by \${Math.abs(Math.round(impressionsChange))}%\`);
          }
          if (positionChange > 5) {
            failures.push(\`Average position worsened by \${Math.round(positionChange * 10) / 10} positions\`);
          }

          if (failures.length > 0) {
            console.error('❌ Significant SEO metric drops detected:');
            failures.forEach(f => console.error(\`   - \${f}\`));
            process.exit(1);
          } else {
            console.log('✅ No significant ranking drops detected');
          }
          "

      - name: Create issue for ranking drops
        if: ${{ (failure()) && steps.tls.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const history = JSON.parse(fs.readFileSync('docs/metrics/search-console-history.json', 'utf8'));
            const latest = history[history.length - 1];
            const previous = history[history.length - 2];
            const date = new Date().toISOString().split('T')[0];

            const clicksChange = ((latest.summary.totalClicks - previous.summary.totalClicks) / previous.summary.totalClicks) * 100;
            const impressionsChange = ((latest.summary.totalImpressions - previous.summary.totalImpressions) / previous.summary.totalImpressions) * 100;
            const positionChange = latest.summary.averagePosition - previous.summary.averagePosition;

            const body = `## 📉 Search Console Ranking Alert

            **Date:** ${date}
            **Period:** ${latest.period.start} to ${latest.period.end}

            ### Metrics Comparison
            | Metric | Current | Previous | Change |
            |--------|---------|----------|--------|
            | Clicks | ${latest.summary.totalClicks} | ${previous.summary.totalClicks} | ${clicksChange > 0 ? '+' : ''}${Math.round(clicksChange)}% |
            | Impressions | ${latest.summary.totalImpressions} | ${previous.summary.totalImpressions} | ${impressionsChange > 0 ? '+' : ''}${Math.round(impressionsChange)}% |
            | Avg Position | ${latest.summary.averagePosition} | ${previous.summary.averagePosition} | ${positionChange > 0 ? '+' : ''}${Math.round(positionChange * 10) / 10} |
            | Avg CTR | ${latest.summary.averageCTR}% | ${previous.summary.averageCTR}% | ${((latest.summary.averageCTR - previous.summary.averageCTR) / previous.summary.averageCTR * 100).toFixed(1)}% |

            ### Top Queries (This Period)
            ${latest.topQueries.slice(0, 5).map((q, i) =>
              \`\${i + 1}. **\${q.query}** - \${q.clicks} clicks, position \${Math.round(q.position * 10) / 10}\`
            ).join('\\n')}

            ### Actions Required
            1. Review the [search console data artifact](${context.payload.repository.html_url}/actions/runs/${context.runId})
            2. Investigate ranking drops for affected queries
            3. Check for algorithm updates or penalties
            4. Review content freshness and quality
            5. Analyze competitor changes

            ---
            *This issue was automatically created by the Search Console workflow.*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Search Ranking Drop Detected (${date})`,
              body: body,
              labels: ['seo', 'search-console', 'automated']
            });
