name: Weekly SEO Check

on:
  # Run every Monday at 9 AM UTC (1 AM PST / 4 AM EST)
  schedule:
    - cron: '0 9 * * 1'

  # Allow manual triggering from GitHub UI
  workflow_dispatch:

env:
  NODE_OPTIONS: --use-openssl-ca
  NODE_USE_SYSTEM_CA: "0"
  NODE_EXTRA_CA_CERTS: ""

jobs:
  seo-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write  # For creating issues with results
      contents: read

    steps:
      # BEGIN GENERATED TLS BOOTSTRAP — .github/security/sync-workflows.mjs
      -
        id: tls
        name: Bootstrap CI trust (offline)
        timeout-minutes: 2
        shell: bash
        run: |
          python3 - <<'PY'
          """Offline, pre-checkout trust bootstrap for GitHub-hosted Ubuntu jobs.

          Inlined into workflows by sync-workflows.mjs; never downloaded at job runtime.
          Temporary root exclusions match Homebrew ca-certificates 2026-10-20:
          https://github.com/Homebrew/homebrew-core/blob/HEAD/Formula/c/ca-certificates.rb
          """

          import hashlib
          import os
          from pathlib import Path
          import re
          import ssl
          import subprocess
          import tempfile


          BLOCKED_KEYS = frozenset({
              "bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3",
              "c619e4780ed8e0abeda24ad732567de4383a7ea941338f6d1a7d1b49ac792fe9",
              "8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782",
          })


          def public_key_hash(pem):
              key = subprocess.run(
                  ["openssl", "x509", "-pubkey", "-noout"], input=pem,
                  capture_output=True, check=True, timeout=5,
              ).stdout
              der = subprocess.run(
                  ["openssl", "pkey", "-pubin", "-outform", "DER"], input=key,
                  capture_output=True, check=True, timeout=5,
              ).stdout
              return hashlib.sha256(der).hexdigest()


          def filter_bundle(source, blocked=BLOCKED_KEYS):
              certs = re.findall(
                  rb"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", source, re.S,
              )
              if not certs or len(certs) != source.count(b"-----BEGIN CERTIFICATE-----"):
                  raise ValueError("empty or truncated CA bundle")
              kept = [cert for cert in certs if public_key_hash(cert) not in blocked]
              if not kept:
                  raise ValueError("no trusted certificates remain")
              result = b"\n".join(kept) + b"\n"
              ssl.create_default_context(cadata=result.decode("ascii"))
              return result, len(certs) - len(kept)


          def main():
              # No network, sudo, checkout, third-party imports, or credentials required.
              bundle, removed = filter_bundle(Path("/etc/ssl/certs/ca-certificates.crt").read_bytes())
              directory = Path(tempfile.mkdtemp(prefix="ci-tls-", dir=os.environ["RUNNER_TEMP"]))
              # Public roots must remain readable by subsequent privilege-dropped steps.
              directory.chmod(0o755)
              ca_file = directory / "ca.pem"
              ca_file.write_bytes(bundle)
              ca_file.chmod(0o644)
              empty = directory / "empty"
              empty.mkdir()
              # A clean CA file alone is insufficient: OpenSSL can also load its hash dir.
              settings = {key: str(ca_file) for key in (
                  "SSL_CERT_FILE", "CURL_CA_BUNDLE", "GIT_SSL_CAINFO",
                  "REQUESTS_CA_BUNDLE", "PIP_CERT", "GRPC_DEFAULT_SSL_ROOTS_FILE_PATH",
              )}
              settings.update(SSL_CERT_DIR=str(empty), GIT_SSL_CAPATH=str(empty))
              # NODE_OPTIONS must be declared in YAML; GITHUB_ENV explicitly forbids it.
              with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
                  for key, value in settings.items():
                      if "\n" in value or "\r" in value:
                          raise ValueError("invalid environment path")
                      output.write(f"{key}={value}\n")
              print(f"CI trust bundle ready; excluded {removed} root certificate(s)")


          if __name__ == "__main__":
              main()
          PY
      # END GENERATED TLS BOOTSTRAP
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run SEO metrics check
        id: seo-check
        run: |
          echo "Running SEO check for dylanbochman.com..."
          npm run check-seo > seo-results.txt 2>&1 || true
          cat seo-results.txt

      - name: Extract metrics
        id: extract
        run: |
          # Extract key metrics from output
          MOBILE_PERF=$(grep "📱 MOBILE METRICS" -A 1 seo-results.txt | grep "Performance:" | awk '{print $3}' || echo "N/A")
          MOBILE_SEO=$(grep "📱 MOBILE METRICS" -A 4 seo-results.txt | grep "SEO:" | awk '{print $3}' || echo "N/A")
          DESKTOP_PERF=$(grep "💻 DESKTOP METRICS" -A 1 seo-results.txt | grep "Performance:" | awk '{print $3}' || echo "N/A")
          DESKTOP_SEO=$(grep "💻 DESKTOP METRICS" -A 4 seo-results.txt | grep "SEO:" | awk '{print $3}' || echo "N/A")

          echo "mobile_performance=$MOBILE_PERF" >> $GITHUB_OUTPUT
          echo "mobile_seo=$MOBILE_SEO" >> $GITHUB_OUTPUT
          echo "desktop_performance=$DESKTOP_PERF" >> $GITHUB_OUTPUT
          echo "desktop_seo=$DESKTOP_SEO" >> $GITHUB_OUTPUT

      - name: Create summary
        run: |
          echo "## 🔍 Weekly SEO Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://dylanbochman.com" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Scores" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Mobile | Desktop |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ steps.extract.outputs.mobile_performance }} | ${{ steps.extract.outputs.desktop_performance }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SEO Score | ${{ steps.extract.outputs.mobile_seo }} | ${{ steps.extract.outputs.desktop_seo }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Full Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat seo-results.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload results artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: seo-results-${{ github.run_number }}
          path: seo-results.txt
          retention-days: 30

      - name: Check for performance degradation
        id: check-degradation
        run: |
          # Extract numeric scores
          MOBILE_PERF=$(echo "${{ steps.extract.outputs.mobile_performance }}" | grep -o '[0-9]*')
          MOBILE_SEO=$(echo "${{ steps.extract.outputs.mobile_seo }}" | grep -o '[0-9]*')
          DESKTOP_PERF=$(echo "${{ steps.extract.outputs.desktop_performance }}" | grep -o '[0-9]*')
          DESKTOP_SEO=$(echo "${{ steps.extract.outputs.desktop_seo }}" | grep -o '[0-9]*')

          # Flag if any score is below threshold
          ALERT=false
          if [ ! -z "$MOBILE_PERF" ] && [ "$MOBILE_PERF" -lt 70 ]; then ALERT=true; fi
          if [ ! -z "$MOBILE_SEO" ] && [ "$MOBILE_SEO" -lt 90 ]; then ALERT=true; fi
          if [ ! -z "$DESKTOP_PERF" ] && [ "$DESKTOP_PERF" -lt 80 ]; then ALERT=true; fi
          if [ ! -z "$DESKTOP_SEO" ] && [ "$DESKTOP_SEO" -lt 90 ]; then ALERT=true; fi

          echo "alert=$ALERT" >> $GITHUB_OUTPUT

      - name: Create issue for degradation
        if: steps.check-degradation.outputs.alert == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const body = `## ⚠️ SEO Performance Alert

            The weekly SEO check detected scores below acceptable thresholds.

            ### Scores

            | Metric | Mobile | Desktop | Threshold |
            |--------|--------|---------|-----------|
            | Performance | ${{ steps.extract.outputs.mobile_performance }} | ${{ steps.extract.outputs.desktop_performance }} | 70/80 |
            | SEO Score | ${{ steps.extract.outputs.mobile_seo }} | ${{ steps.extract.outputs.desktop_seo }} | 90 |

            ### Action Required

            1. Review the [full workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            2. Check PageSpeed Insights: https://pagespeed.web.dev/analysis?url=https://dylanbochman.com
            3. Investigate recent changes that may have impacted performance
            4. Run \`npm run check-seo\` locally for detailed diagnostics

            ### Resources

            - [SEO Measurement Docs](https://github.com/${{ github.repository }}/blob/main/docs/SEO_MEASUREMENT.md)
            - [Core Web Vitals Guide](https://web.dev/vitals/)

            ---

            **Workflow Run:** ${{ github.run_id }}
            **Date:** ${date}
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔍 SEO Alert: Performance degradation detected (${date})`,
              body: body,
              labels: ['seo', 'performance', 'automated']
            });
