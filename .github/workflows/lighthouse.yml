name: Lighthouse CI

on:
  workflow_run:
    workflows: ["Build, Test, and Deploy"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        type: string
  # Path-based trigger for significant UI changes
  push:
    branches:
      - main
    paths:
      - 'src/pages/**'
      - 'src/components/**'
      - 'src/index.css'
      - 'index.html'
      - 'tailwind.config.*'
      - 'vite.config.*'

env:
  NODE_OPTIONS: --use-openssl-ca
  NODE_USE_SYSTEM_CA: "0"
  NODE_EXTRA_CA_CERTS: ""

jobs:
  lighthouse:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    # Each page is audited 3x for a median (scripts/lighthouse-multi-page.mjs),
    # so the audit phase runs ~3x longer than a single-run pass.
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write

    steps:
      # BEGIN GENERATED TLS BOOTSTRAP — .github/security/sync-workflows.mjs
      -
        id: tls
        name: Bootstrap CI trust (offline)
        timeout-minutes: 2
        shell: bash
        run: |
          python3 - <<'PY'
          """Offline, pre-checkout trust bootstrap for GitHub-hosted Ubuntu jobs.

          Inlined into workflows by sync-workflows.mjs; never downloaded at job runtime.
          Temporary root exclusions match Homebrew ca-certificates 2026-10-20:
          https://github.com/Homebrew/homebrew-core/blob/HEAD/Formula/c/ca-certificates.rb
          """

          import hashlib
          import os
          from pathlib import Path
          import re
          import ssl
          import subprocess
          import tempfile


          BLOCKED_KEYS = frozenset({
              "bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3",
              "c619e4780ed8e0abeda24ad732567de4383a7ea941338f6d1a7d1b49ac792fe9",
              "8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782",
          })


          def require_patched_node(version):
              # Release-specific floors: accepting an arbitrary newer major would admit
              # EOL Node 25. Pre-release/custom builds need independent evidence.
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", version.strip())
              floors = {22: (22, 23, 4), 24: (24, 22, 1), 26: (26, 12, 1)}
              parts = tuple(map(int, match.groups())) if match else ()
              if not parts or parts[0] not in floors or parts < floors[parts[0]]:
                  raise ValueError(f"unpatched or unverified Node runtime: {version.strip()}")


          def runner_node(proc=Path("/proc"), pid=None):
              # The runner launches JS actions from its own externals directory, ignoring
              # setup-node's PATH. Follow our real parent chain, not a guessed install path.
              pid = os.getpid() if pid is None else pid
              for _ in range(32):
                  process = proc / str(pid)
                  executable = (process / "exe").resolve(strict=True)
                  if executable.name == "Runner.Worker":
                      node = executable.parent.parent / "externals/node24/bin/node"
                      if not node.is_file():
                          raise ValueError("runner Node 24 is missing")
                      return node
                  status = (process / "status").read_text()
                  parent = re.search(r"^PPid:\s+(\d+)$", status, re.M)
                  if not parent or int(parent[1]) <= 1:
                      break
                  pid = int(parent[1])
              raise ValueError("cannot establish GitHub Actions runner ownership")


          def verify_runner_node():
              node = runner_node()
              # Version-only probe: no application, network, input decompression or secrets.
              version = subprocess.run(
                  [str(node), "--version"], check=True, capture_output=True, text=True,
                  timeout=5, env={"PATH": "/usr/bin:/bin"},
              ).stdout.strip()
              require_patched_node(version)
              if not version.startswith("v24."):
                  raise ValueError("unexpected runner action runtime major")
              print(f"Runner JavaScript action runtime verified: {version}")


          def public_key_hash(pem):
              key = subprocess.run(
                  ["openssl", "x509", "-pubkey", "-noout"], input=pem,
                  capture_output=True, check=True, timeout=5,
              ).stdout
              der = subprocess.run(
                  ["openssl", "pkey", "-pubin", "-outform", "DER"], input=key,
                  capture_output=True, check=True, timeout=5,
              ).stdout
              return hashlib.sha256(der).hexdigest()


          def filter_bundle(source, blocked=BLOCKED_KEYS):
              certs = re.findall(
                  rb"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", source, re.S,
              )
              if not certs or len(certs) != source.count(b"-----BEGIN CERTIFICATE-----"):
                  raise ValueError("empty or truncated CA bundle")
              kept = [cert for cert in certs if public_key_hash(cert) not in blocked]
              if not kept:
                  raise ValueError("no trusted certificates remain")
              result = b"\n".join(kept) + b"\n"
              ssl.create_default_context(cadata=result.decode("ascii"))
              return result, len(certs) - len(kept)


          def main():
              # No network, sudo, checkout, third-party imports, or credentials required.
              verify_runner_node()
              bundle, removed = filter_bundle(Path("/etc/ssl/certs/ca-certificates.crt").read_bytes())
              directory = Path(tempfile.mkdtemp(prefix="ci-tls-", dir=os.environ["RUNNER_TEMP"]))
              # Public roots must remain readable by subsequent privilege-dropped steps.
              directory.chmod(0o755)
              ca_file = directory / "ca.pem"
              ca_file.write_bytes(bundle)
              ca_file.chmod(0o644)
              empty = directory / "empty"
              empty.mkdir()
              # A clean CA file alone is insufficient: OpenSSL can also load its hash dir.
              settings = {key: str(ca_file) for key in (
                  "SSL_CERT_FILE", "CURL_CA_BUNDLE", "GIT_SSL_CAINFO",
                  "REQUESTS_CA_BUNDLE", "PIP_CERT", "GRPC_DEFAULT_SSL_ROOTS_FILE_PATH",
              )}
              settings.update(SSL_CERT_DIR=str(empty), GIT_SSL_CAPATH=str(empty))
              # NODE_OPTIONS must be declared in YAML; GITHUB_ENV explicitly forbids it.
              with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
                  for key, value in settings.items():
                      if "\n" in value or "\r" in value:
                          raise ValueError("invalid environment path")
                      output.write(f"{key}={value}\n")
              print(f"CI trust bundle ready; excluded {removed} root certificate(s)")


          if __name__ == "__main__":
              main()
          PY
      # END GENERATED TLS BOOTSTRAP
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for deployment to be live
        if: github.event_name == 'workflow_run'
        run: |
          echo "Polling for deployment to be live..."
          for i in {1..20}; do
            if curl -sf https://dylanbochman.com > /dev/null 2>&1; then
              echo "Site is live after $((i * 5)) seconds"
              exit 0
            fi
            echo "Attempt $i: waiting 5 seconds..."
            sleep 5
          done
          echo "Site did not become available within 100 seconds"
          exit 1

      - name: Run Lighthouse on production (multi-page)
        run: node scripts/lighthouse-multi-page.mjs

      - name: Save Lighthouse reports
        run: |
          # Multi-page script generates lighthouse-reports/summary.json
          # Copy to docs/metrics for historical tracking
          mkdir -p docs/metrics
          cp lighthouse-reports/summary.json docs/metrics/latest-multi-page.json

          # Also save timestamp for tracking
          echo "{\"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"commit\": \"${{ github.sha }}\"}" > docs/metrics/last-run.json

      - name: Commit updated metrics to lighthouse-metrics branch
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Move files to temp location before branch switch
          mv lighthouse-reports /tmp/lighthouse-reports
          mv docs/metrics /tmp/metrics

          # Create or switch to lighthouse-metrics branch
          git fetch origin lighthouse-metrics:lighthouse-metrics 2>/dev/null || git checkout -b lighthouse-metrics
          git checkout lighthouse-metrics

          # Remove existing directories if they exist
          rm -rf lighthouse-reports docs/metrics

          # Move files back from temp location
          mv /tmp/lighthouse-reports lighthouse-reports
          mv /tmp/metrics docs/metrics

          # Add and commit if there are changes
          git add lighthouse-reports/ docs/metrics/
          git diff --staged --quiet || git commit -m "chore: update multi-page Lighthouse metrics [skip ci]"

          # Push to lighthouse-metrics branch
          git push origin lighthouse-metrics

      - name: Upload Lighthouse reports
        if: ${{ (always()) && steps.tls.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-reports
          path: |
            lighthouse-reports/
            docs/metrics/
          retention-days: 30

      - name: Check performance thresholds (multi-page)
        id: threshold_check
        run: |
          node -e "
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync('./lighthouse-reports/summary.json', 'utf8'));

          console.log('📊 Multi-Page Lighthouse Scores:\\n');
          console.log('┌─────────────────┬──────┬──────┬─────┬───────┐');
          console.log('│ Page            │ Perf │ A11y │ SEO │ Best  │');
          console.log('├─────────────────┼──────┼──────┼─────┼───────┤');

          const failures = [];
          summary.forEach(page => {
            const pageName = page.page.padEnd(15);
            const perf = String(page.performance).padStart(4);
            const a11y = String(page.accessibility).padStart(4);
            const seo = String(page.seo).padStart(3);
            const best = String(page.bestPractices).padStart(5);
            console.log(\`│ \${pageName} │ \${perf} │ \${a11y} │ \${seo} │ \${best} │\`);

            // Check thresholds per page
            // Performance varies in CI (~60-80) vs local (~90+). Set floor at 50 for CI variability.
            // SEO at 90 is good for personal sites (92 typical). Accessibility at 90 still flags regressions without flakiness.
            if (page.performance < 50) failures.push(\`\${page.page}: Performance \${page.performance} < 50\`);
            if (page.accessibility < 90) failures.push(\`\${page.page}: Accessibility \${page.accessibility} < 90\`);
            if (page.seo < 90) failures.push(\`\${page.page}: SEO \${page.seo} < 90\`);
            if (page.bestPractices < 90) failures.push(\`\${page.page}: Best Practices \${page.bestPractices} < 90\`);
          });

          console.log('└─────────────────┴──────┴──────┴─────┴───────┘\\n');

          if (failures.length > 0) {
            console.error('❌ Lighthouse thresholds not met:\\n');
            failures.forEach(f => console.error(\`   - \${f}\`));
            console.error('\\n📝 Thresholds: Performance ≥50, Accessibility ≥90, SEO ≥90, Best Practices ≥90');
            process.exit(1);
          } else {
            console.log('✅ All pages passed Lighthouse thresholds!');
          }
          "

      - name: Create issue for performance degradation
        if: ${{ (failure() && steps.threshold_check.conclusion == 'failure') && steps.tls.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('./lighthouse-reports/summary.json', 'utf8'));
            const date = new Date().toISOString().split('T')[0];

            // Build scores table
            let scoresTable = `| Page | Performance | Accessibility | SEO | Best Practices |\n`;
            scoresTable += `|------|-------------|---------------|-----|----------------|\n`;

            summary.forEach(page => {
              const perfStatus = page.performance >= 50 ? '✅' : '❌';
              const a11yStatus = page.accessibility >= 90 ? '✅' : '❌';
              const seoStatus = page.seo >= 90 ? '✅' : '❌';
              const bpStatus = page.bestPractices >= 90 ? '✅' : '❌';

              scoresTable += `| ${page.page} | ${page.performance} ${perfStatus} | ${page.accessibility} ${a11yStatus} | ${page.seo} ${seoStatus} | ${page.bestPractices} ${bpStatus} |\n`;
            });

            // Build Core Web Vitals table
            let vitalsTable = `| Page | LCP | FCP | CLS | TBT |\n`;
            vitalsTable += `|------|-----|-----|-----|-----|\n`;

            summary.forEach(page => {
              vitalsTable += `| ${page.page} | ${page.lcp} | ${page.fcp} | ${page.cls} | ${page.tbt} |\n`;
            });

            const body = `## 📉 Multi-Page Lighthouse Performance Alert

            **Date:** ${date}
            **Base URL:** https://dylanbochman.com

            ### Scores by Page
            ${scoresTable}

            **Thresholds:** Performance ≥50, Accessibility ≥90, SEO ≥90, Best Practices ≥90

            ### Core Web Vitals
            ${vitalsTable}

            ### Pages Tested
            ${summary.map(p => `- **${p.page}**: ${p.url}`).join('\n')}

            ### Actions Required
            1. Review the [Lighthouse reports artifact](${context.payload.repository.html_url}/actions/runs/${context.runId})
            2. Check detailed reports in \`lighthouse-reports/\` directory
            3. Investigate pages with failing scores
            4. Review [metrics history](${context.payload.repository.html_url}/tree/lighthouse-metrics/lighthouse-reports) on lighthouse-metrics branch

            ---
            *This issue was automatically created by the Multi-Page Lighthouse CI workflow.*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Multi-Page Lighthouse Performance Degradation (${date})`,
              body: body,
              labels: ['performance', 'lighthouse', 'automated']
            });
