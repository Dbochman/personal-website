name: Console Error Check

on:
  # Run after successful deployment
  workflow_run:
    workflows: ["Build, Test, and Deploy"]
    types:
      - completed

  # Allow manual triggering
  workflow_dispatch:

concurrency:
  # Post-deploy checks supersede older post-deploy checks. Manual checks target
  # the currently deployed SHA and must not cancel that production lifecycle.
  group: production-browser-check-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'post-deploy' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  NODE_OPTIONS: --use-openssl-ca
  NODE_USE_SYSTEM_CA: "0"
  NODE_EXTRA_CA_CERTS: ""

jobs:
  console-check:
    # Only run if the deploy workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required by the create/update/recovery issue lifecycle below.
      issues: write

    steps:
      # BEGIN GENERATED TLS BOOTSTRAP — .github/security/sync-workflows.mjs
      -
        id: tls
        name: Bootstrap CI trust (offline)
        timeout-minutes: 2
        shell: bash
        run: |
          python3 - <<'PY'
          """Offline, pre-checkout trust bootstrap for GitHub-hosted Ubuntu jobs.

          Inlined into workflows by sync-workflows.mjs; never downloaded at job runtime.
          Temporary root exclusions match Homebrew ca-certificates 2026-10-20:
          https://github.com/Homebrew/homebrew-core/blob/HEAD/Formula/c/ca-certificates.rb
          """

          import hashlib
          import os
          from pathlib import Path
          import re
          import ssl
          import subprocess
          import tempfile


          BLOCKED_KEYS = frozenset({
              "bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3",
              "c619e4780ed8e0abeda24ad732567de4383a7ea941338f6d1a7d1b49ac792fe9",
              "8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782",
          })


          def require_patched_node(version):
              # Release-specific floors: accepting an arbitrary newer major would admit
              # EOL Node 25. Pre-release/custom builds need independent evidence.
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", version.strip())
              floors = {22: (22, 23, 4), 24: (24, 22, 1), 26: (26, 12, 1)}
              parts = tuple(map(int, match.groups())) if match else ()
              if not parts or parts[0] not in floors or parts < floors[parts[0]]:
                  raise ValueError(f"unpatched or unverified Node runtime: {version.strip()}")


          def runner_node(proc=Path("/proc"), pid=None):
              # The runner launches JS actions from its own externals directory, ignoring
              # setup-node's PATH. Follow our real parent chain, not a guessed install path.
              pid = os.getpid() if pid is None else pid
              for _ in range(32):
                  process = proc / str(pid)
                  executable = (process / "exe").resolve(strict=True)
                  if executable.name == "Runner.Worker":
                      node = executable.parent.parent / "externals/node24/bin/node"
                      if not node.is_file():
                          raise ValueError("runner Node 24 is missing")
                      return node
                  status = (process / "status").read_text()
                  parent = re.search(r"^PPid:\s+(\d+)$", status, re.M)
                  if not parent or int(parent[1]) <= 1:
                      break
                  pid = int(parent[1])
              raise ValueError("cannot establish GitHub Actions runner ownership")


          def verify_runner_node(exception=None):
              node = runner_node()
              # Version-only probe: no application, network, input decompression or secrets.
              version = subprocess.run(
                  [str(node), "--version"], check=True, capture_output=True, text=True,
                  timeout=5, env={"PATH": "/usr/bin:/bin"},
              ).stdout.strip()
              try:
                  require_patched_node(version)
              except ValueError:
                  if exception is None or not exception(version):
                      raise
                  print("::warning::Temporary PR #339 exception: action Node v24.21.0 remains "
                        "unpatched; this job executes no JavaScript actions. Expires "
                        "2026-10-26T14:00:00Z; review 2026-10-25 at 10:00 EDT.")
                  return
              if not version.startswith("v24."):
                  raise ValueError("unexpected runner action runtime major")
              print(f"Runner JavaScript action runtime verified: {version}")


          def public_key_hash(pem):
              key = subprocess.run(
                  ["openssl", "x509", "-pubkey", "-noout"], input=pem,
                  capture_output=True, check=True, timeout=5,
              ).stdout
              der = subprocess.run(
                  ["openssl", "pkey", "-pubin", "-outform", "DER"], input=key,
                  capture_output=True, check=True, timeout=5,
              ).stdout
              return hashlib.sha256(der).hexdigest()


          def filter_bundle(source, blocked=BLOCKED_KEYS):
              certs = re.findall(
                  rb"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", source, re.S,
              )
              if not certs or len(certs) != source.count(b"-----BEGIN CERTIFICATE-----"):
                  raise ValueError("empty or truncated CA bundle")
              kept = [cert for cert in certs if public_key_hash(cert) not in blocked]
              if not kept:
                  raise ValueError("no trusted certificates remain")
              result = b"\n".join(kept) + b"\n"
              ssl.create_default_context(cadata=result.decode("ascii"))
              return result, len(certs) - len(kept)


          def main(exception=None):
              # No network, sudo, checkout, third-party imports, or credentials required.
              verify_runner_node(exception=exception)
              bundle, removed = filter_bundle(Path("/etc/ssl/certs/ca-certificates.crt").read_bytes())
              directory = Path(tempfile.mkdtemp(prefix="ci-tls-", dir=os.environ["RUNNER_TEMP"]))
              # Public roots must remain readable by subsequent privilege-dropped steps.
              directory.chmod(0o755)
              ca_file = directory / "ca.pem"
              ca_file.write_bytes(bundle)
              ca_file.chmod(0o644)
              empty = directory / "empty"
              empty.mkdir()
              # A clean CA file alone is insufficient: OpenSSL can also load its hash dir.
              settings = {key: str(ca_file) for key in (
                  "SSL_CERT_FILE", "CURL_CA_BUNDLE", "GIT_SSL_CAINFO",
                  "REQUESTS_CA_BUNDLE", "PIP_CERT", "GRPC_DEFAULT_SSL_ROOTS_FILE_PATH",
              )}
              settings.update(SSL_CERT_DIR=str(empty), GIT_SSL_CAPATH=str(empty))
              # NODE_OPTIONS must be declared in YAML; GITHUB_ENV explicitly forbids it.
              with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
                  for key, value in settings.items():
                      if "\n" in value or "\r" in value:
                          raise ValueError("invalid environment path")
                      output.write(f"{key}={value}\n")
              print(f"CI trust bundle ready; excluded {removed} root certificate(s)")


          if __name__ == "__main__":
              main()
          PY
      # END GENERATED TLS BOOTSTRAP
      - name: Resolve target deployment
        id: deployment
        env:
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target_sha=$(curl -fsS \
              -H 'cache-control: no-cache' \
              "https://dylanbochman.com/build-info.json?manual=${{ github.run_id }}" \
              | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).sha")
          else
            target_sha="$TRIGGER_SHA"
          fi

          if ! [[ "$target_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unable to resolve a valid deployed commit SHA"
            exit 1
          fi

          echo "sha=$target_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Test the source that produced the completed deployment. Without an
          # explicit ref, a newer commit on main can be checked out while its
          # deployment is still in flight, making dynamic route tests race prod.
          ref: ${{ steps.deployment.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Playwright runs the runner's preinstalled Chrome (channel: 'chrome' in
      # playwright.config.ts when CI=true) — browser downloads from Playwright's
      # CDN hung indefinitely on 2026-06-10.
      - name: Verify system Chrome
        run: google-chrome --version

      - name: Wait for the triggering deployment
        env:
          EXPECTED_SHA: ${{ steps.deployment.outputs.sha }}
        run: |
          echo "Polling for deployed sha ${EXPECTED_SHA}..."
          for i in {1..20}; do
            live_sha=$(curl -fsS \
              -H 'cache-control: no-cache' \
              "https://dylanbochman.com/build-info.json?check=${EXPECTED_SHA}" \
              | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).sha" \
              2>/dev/null || true)
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "Production matches ${EXPECTED_SHA} after $((i * 5)) seconds"
              exit 0
            fi
            echo "Attempt $i: live sha ${live_sha:-unavailable}; waiting 5 seconds..."
            sleep 5
          done
          echo "Production did not serve ${EXPECTED_SHA} within 100 seconds"
          exit 1

      - name: Run console error checks on production
        env:
          BASE_URL: https://dylanbochman.com
        # Only run console-errors and smoke tests (exclude visual regression and 404 tests)
        # Visual regression has its own workflow; 404 test pollutes GA4 analytics
        run: npx playwright test tests/e2e/console-errors.spec.ts --grep "@smoke"

      - name: Upload test results
        if: ${{ (always()) && steps.tls.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: console-check-results
          path: |
            test-results/
            playwright-report/
          retention-days: 14

      - name: Create or update browser check issue
        if: ${{ (failure()) && steps.tls.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const body = `## 🚨 Production Browser Check Failed

            The automated production browser check failed. This can indicate a
            console error, a smoke-test regression, or a workflow/setup problem.

            ### Details

            - **Date**: ${date}
            - **Site**: https://dylanbochman.com
            - **Workflow Run**: [View Details](${runUrl})

            ### What to do

            1. Review the [test results](${runUrl}) for specific error messages
            2. Check the artifacts for detailed logs
            3. Reproduce locally by running: \`npm run test:e2e\`
            4. Fix the errors and redeploy

            ### Test Report

            Download the full test report from the workflow artifacts to see:
            - Console error messages
            - The failed smoke assertion
            - Screenshots and traces, when available

            ---

            **Automated check run**: ${{ github.run_id }}
            `;

            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'automated',
              state: 'open',
              per_page: 100
            });
            const existing = openIssues.find(issue =>
              !issue.pull_request &&
              (issue.title.startsWith('🚨 Production Browser Check Failed') ||
                issue.title.startsWith('🚨 Console Errors Detected'))
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `### Repeated failure (${date})\n\n[View workflow run](${runUrl}).`
              });
              core.info(`Updated active browser-check issue #${existing.number}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Production Browser Check Failed (${date})`,
              body: body,
              labels: ['bug', 'automated']
            });

      - name: Close recovered browser check issues
        if: success()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'automated',
              state: 'open',
              per_page: 100
            });
            const recovered = openIssues.filter(issue =>
              !issue.pull_request &&
              (issue.title.startsWith('🚨 Production Browser Check Failed') ||
                issue.title.startsWith('🚨 Console Errors Detected'))
            );

            for (const issue of recovered) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `✅ Recovered: the [latest production browser check](${runUrl}) passed.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed'
              });
            }

            core.info(`Closed ${recovered.length} recovered browser-check issue(s)`);

      - name: Post success summary
        if: success()
        run: |
          echo "## ✅ Production Browser Check Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No critical console errors or smoke-test failures were detected on the production site." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Checked:**" >> $GITHUB_STEP_SUMMARY
          echo "- Home page (https://dylanbochman.com)" >> $GITHUB_STEP_SUMMARY
          echo "- Blog list and newest deployed blog post" >> $GITHUB_STEP_SUMMARY
          echo "- Runbook page (https://dylanbochman.com/runbook)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u +%Y-%m-%d\ %H:%M\ UTC)" >> $GITHUB_STEP_SUMMARY
