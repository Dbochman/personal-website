name: Build, Test, and Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on feature branches, but let main runs finish — each
  # push to main publishes distinct content (e.g. PR merge + sync-changelog bot
  # commit) and cancelling mid-deploy just delays the prior content from landing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_OPTIONS: --use-openssl-ca
  NODE_USE_SYSTEM_CA: "0"
  NODE_EXTRA_CA_CERTS: ""

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      is_content_only: ${{ steps.check.outputs.content_only }}
    steps:
      # BEGIN GENERATED TLS BOOTSTRAP — .github/security/sync-workflows.mjs
      - &tls-bootstrap
        id: tls
        name: Bootstrap CI trust (offline)
        timeout-minutes: 2
        shell: bash
        run: |
          python3 - <<'PY'
          """Offline, pre-checkout trust bootstrap for GitHub-hosted Ubuntu jobs.

          Inlined into workflows by sync-workflows.mjs; never downloaded at job runtime.
          Temporary root exclusions match Homebrew ca-certificates 2026-10-20:
          https://github.com/Homebrew/homebrew-core/blob/HEAD/Formula/c/ca-certificates.rb
          """

          import hashlib
          import os
          from pathlib import Path
          import re
          import ssl
          import subprocess
          import tempfile


          BLOCKED_KEYS = frozenset({
              "bd153ed7b0434f6886b17bce8bbe84ed340c7132d702a8f4fa318f756ecbd6f3",
              "c619e4780ed8e0abeda24ad732567de4383a7ea941338f6d1a7d1b49ac792fe9",
              "8d417db2dd8bf5e3084d1e3f196d583849d81bdd4c00c70b9d39369e96b8c782",
          })


          def require_patched_node(version):
              # Release-specific floors: accepting an arbitrary newer major would admit
              # EOL Node 25. Pre-release/custom builds need independent evidence.
              match = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)", version.strip())
              floors = {22: (22, 23, 4), 24: (24, 22, 1), 26: (26, 12, 1)}
              parts = tuple(map(int, match.groups())) if match else ()
              if not parts or parts[0] not in floors or parts < floors[parts[0]]:
                  raise ValueError(f"unpatched or unverified Node runtime: {version.strip()}")


          def runner_node(proc=Path("/proc"), pid=None):
              # The runner launches JS actions from its own externals directory, ignoring
              # setup-node's PATH. Follow our real parent chain, not a guessed install path.
              pid = os.getpid() if pid is None else pid
              for _ in range(32):
                  process = proc / str(pid)
                  executable = (process / "exe").resolve(strict=True)
                  if executable.name == "Runner.Worker":
                      node = executable.parent.parent / "externals/node24/bin/node"
                      if not node.is_file():
                          raise ValueError("runner Node 24 is missing")
                      return node
                  status = (process / "status").read_text()
                  parent = re.search(r"^PPid:\s+(\d+)$", status, re.M)
                  if not parent or int(parent[1]) <= 1:
                      break
                  pid = int(parent[1])
              raise ValueError("cannot establish GitHub Actions runner ownership")


          def verify_runner_node(exception=None):
              node = runner_node()
              # Version-only probe: no application, network, input decompression or secrets.
              version = subprocess.run(
                  [str(node), "--version"], check=True, capture_output=True, text=True,
                  timeout=5, env={"PATH": "/usr/bin:/bin"},
              ).stdout.strip()
              try:
                  require_patched_node(version)
              except ValueError:
                  if exception is None or not exception(version):
                      raise
                  print("::warning::Temporary PR #339 exception: action Node v24.21.0 remains "
                        "unpatched; this job executes no JavaScript actions. Expires "
                        "2026-10-26T14:00:00Z; review 2026-10-25 at 10:00 EDT.")
                  return
              if not version.startswith("v24."):
                  raise ValueError("unexpected runner action runtime major")
              print(f"Runner JavaScript action runtime verified: {version}")


          def public_key_hash(pem):
              key = subprocess.run(
                  ["openssl", "x509", "-pubkey", "-noout"], input=pem,
                  capture_output=True, check=True, timeout=5,
              ).stdout
              der = subprocess.run(
                  ["openssl", "pkey", "-pubin", "-outform", "DER"], input=key,
                  capture_output=True, check=True, timeout=5,
              ).stdout
              return hashlib.sha256(der).hexdigest()


          def filter_bundle(source, blocked=BLOCKED_KEYS):
              certs = re.findall(
                  rb"-----BEGIN CERTIFICATE-----.*?-----END CERTIFICATE-----", source, re.S,
              )
              if not certs or len(certs) != source.count(b"-----BEGIN CERTIFICATE-----"):
                  raise ValueError("empty or truncated CA bundle")
              kept = [cert for cert in certs if public_key_hash(cert) not in blocked]
              if not kept:
                  raise ValueError("no trusted certificates remain")
              result = b"\n".join(kept) + b"\n"
              ssl.create_default_context(cadata=result.decode("ascii"))
              return result, len(certs) - len(kept)


          def main(exception=None):
              # No network, sudo, checkout, third-party imports, or credentials required.
              verify_runner_node(exception=exception)
              bundle, removed = filter_bundle(Path("/etc/ssl/certs/ca-certificates.crt").read_bytes())
              directory = Path(tempfile.mkdtemp(prefix="ci-tls-", dir=os.environ["RUNNER_TEMP"]))
              # Public roots must remain readable by subsequent privilege-dropped steps.
              directory.chmod(0o755)
              ca_file = directory / "ca.pem"
              ca_file.write_bytes(bundle)
              ca_file.chmod(0o644)
              empty = directory / "empty"
              empty.mkdir()
              # A clean CA file alone is insufficient: OpenSSL can also load its hash dir.
              settings = {key: str(ca_file) for key in (
                  "SSL_CERT_FILE", "CURL_CA_BUNDLE", "GIT_SSL_CAINFO",
                  "REQUESTS_CA_BUNDLE", "PIP_CERT", "GRPC_DEFAULT_SSL_ROOTS_FILE_PATH",
              )}
              settings.update(SSL_CERT_DIR=str(empty), GIT_SSL_CAPATH=str(empty))
              # NODE_OPTIONS must be declared in YAML; GITHUB_ENV explicitly forbids it.
              with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as output:
                  for key, value in settings.items():
                      if "\n" in value or "\r" in value:
                          raise ValueError("invalid environment path")
                      output.write(f"{key}={value}\n")
              print(f"CI trust bundle ready; excluded {removed} root certificate(s)")


          if __name__ == "__main__":
              main()
          PY
      # END GENERATED TLS BOOTSTRAP
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 10
      - name: Detect content-only changes
        id: check
        run: |
          BEFORE=${{ github.event.before }}
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "content_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "content_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED_FILES=$(git diff --name-only "$BEFORE" HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"
          CONTENT_ONLY=true
          while IFS= read -r file; do
            case "$file" in
              content/blog/*.txt|content/kanban/*.md|content/kanban/**/*.md) ;;
              docs/metrics/*.json) ;;
              src/generated/*) ;;
              public/rss.xml|public/sitemap.xml|public/atom.xml) ;;
              public/og-images/*) ;;
              .claude/*|*.md) ;;
              *) CONTENT_ONLY=false; break ;;
            esac
          done <<< "$CHANGED_FILES"
          echo "content_only=$CONTENT_ONLY" >> "$GITHUB_OUTPUT"

  build-and-test:
    runs-on: ubuntu-latest
    needs: detect-changes
    steps:
      - *tls-bootstrap
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache MDX compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .cache/mdx
          key: mdx-${{ hashFiles('package-lock.json', 'scripts/precompile-mdx.ts', 'src/content/blog/schema.ts', 'content/blog/**/*.txt') }}
          restore-keys: |
            mdx-

      - name: Build mode
        run: |
          if [ "${{ needs.detect-changes.outputs.is_content_only }}" = "true" ]; then
            echo "::notice::Content-only deploy: skipping non-build checks, running full prerender build"
          else
            echo "::notice::Full build and test pipeline"
          fi

      # Playwright runs the runner's preinstalled Chrome (channel: 'chrome' in
      # playwright.config.ts and scripts/prerender.mjs when CI=true) — browser
      # downloads from Playwright's CDN hung indefinitely on 2026-06-10.
      - name: Verify system Chrome
        run: google-chrome --version

      - name: Security audit
        if: needs.detect-changes.outputs.is_content_only != 'true'
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true

      - name: Run unit tests
        if: needs.detect-changes.outputs.is_content_only != 'true'
        run: npm test

      - name: Build site
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Verify SEO route artifacts
        run: npm run verify-seo-routes

      - name: Upload source maps to Sentry
        if: needs.detect-changes.outputs.is_content_only != 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          npx sentry-cli releases new ${{ github.sha }}
          npx sentry-cli sourcemaps upload ./dist/assets --release=${{ github.sha }} --url-prefix '~/assets'
          npx sentry-cli releases finalize ${{ github.sha }}

      - name: Remove source maps from build
        if: needs.detect-changes.outputs.is_content_only != 'true'
        run: find ./dist -name '*.map' -delete

      # Bundle size check uses raw (uncompressed) file sizes as a build guard.
      # This catches accidental bloat from new dependencies or unoptimized code.
      # Actual transfer sizes are ~70% smaller due to gzip/brotli compression.
      - name: Check bundle size budget
        if: needs.detect-changes.outputs.is_content_only != 'true'
        run: npm run check-bundle-budget

      - name: Start preview server
        if: needs.detect-changes.outputs.is_content_only != 'true'
        run: npm run preview &
        env:
          CI: true

      - name: Wait for server to be ready
        if: needs.detect-changes.outputs.is_content_only != 'true'
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Run smoke tests
        if: needs.detect-changes.outputs.is_content_only != 'true'
        run: BASE_URL=http://localhost:4173 npx playwright test --grep @smoke
        env:
          CI: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: ./dist
          retention-days: 1

      - name: Upload test results
        if: ${{ (failure() && needs.detect-changes.outputs.is_content_only != 'true') && steps.tls.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-test-results
          path: playwright-report/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - *tls-bootstrap
      # No source checkout in this job — the deploy push must contain ONLY
      # the build artifact, never source files. The verify-live job (below)
      # owns source access for the smoke check.
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: ./dist

      - name: Deploy to GitHub Pages
        run: |
          cd dist
          echo "dylanbochman.com" > CNAME
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/Dbochman/dbochman.github.io.git" main

  verify-live:
    # Probes the live deployment to confirm GitHub Pages actually serves
    # /foo from foo.html (not a 3xx to /foo/) when both foo.html and
    # foo/index.html exist, and that trailing-slash / legacy URLs serve
    # the right meta-refresh redirect. Runs in its own job with a fresh
    # workspace so source files are physically separated from the deploy
    # push that already completed.
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - *tls-bootstrap
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: ./dist

      - name: Verify live route artifacts
        run: node scripts/smoke-live-routes.mjs https://dylanbochman.com ./dist ./src/data/seo-redirects.json
